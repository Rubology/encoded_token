# This workflow will download a prebuilt Ruby version, install dependencies and run tests with Rake
# For more information see: https://github.com/marketplace/actions/setup-ruby-jruby-and-truffleruby

name: 100% Coverage

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  build:
    runs-on: ubuntu-latest

    env: # $BUNDLE_GEMFILE must be set at the job level, so it is set for all steps
      BUNDLE_GEMFILE: ${{ github.workspace }}/gemfiles/ruby-4-0/Gemfile
      GITHUB_ACTION: true

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 50

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0' # Not needed with a .ruby-version file
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically

      - name: Install Gems
        run: rake install

      - name: Run tests
        run: |
          rm -rf coverage
          rake coverage

      - name: Show uncovered lines
        if: always()
        run: |
          ruby -rjson -e '
            data = JSON.parse(File.read("coverage/.resultset.json"))
      
            data.each do |command_name, payload|
              puts "== #{command_name} =="
      
              payload.fetch("coverage", {}).each do |file, entry|
                lines = entry.is_a?(Hash) ? entry["lines"] : entry
                next unless lines
      
                missed = lines.each_with_index.filter_map do |count, index|
                  index + 1 if count == 0
                end
      
                next if missed.empty?
                puts "#{file}: #{missed.join(", ")}"
              end
            end
          '

      - name: Assert 100% Test Coverage
        run: >
          ruby -e "require('json') && 
          (rate = JSON.parse(File.read('coverage/.last_run.json'))['result']['line'].to_i) &&
          (rate == 100 ? exit(0) : exit(rate))"
